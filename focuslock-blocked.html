<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusLock</title>
  <link rel="stylesheet" href="focuslock-blocked.css">
</head>

<body>

  <main>
    <div class="lock">●</div>

    <div class="eyebrow">
      FOCUSLOCK
    </div>

    <h1>Focus mode is active.</h1>

    <p>
      This destination is outside your allowed websites.
    </p>

    <div id="timer" class="timer">
      --
    </div>

    <div class="label">
      remaining
    </div>

    <div class="rule"></div>

    <div id="sites" class="sites"></div>
  </main>

  <script src="focuslock-blocked.js"></script>

</body>
</html>
